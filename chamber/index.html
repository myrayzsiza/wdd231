<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamber of Commerce | Home</title>
  <link rel="stylesheet" href="styles/small.css">
  <link rel="stylesheet" href="styles/large.css" media="screen and (min-width: 768px)">
</head>
<body>
  <header id="siteHeader">
    <h1>My Chamber of Commerce</h1>
    <nav>
      <ul id="navMenu">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="directory.html">Directory</a></li>
        <li><a href="join.html">Join</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <img src="images/hero.jpg" alt="Community Hero Image">
    <div class="cta">
      <a href="join.html" class="btn">Join the Chamber</a>
    </div>
  </section>

  <!-- Current Events -->
  <section class="events">
    <h2>Upcoming Events</h2>
    <ul>
      <li>Business Networking Night – Nov 20</li>
      <li>Holiday Market – Dec 5</li>
    </ul>
  </section>

  <!-- Weather -->
  <section class="weather">
    <h2>Local Weather</h2>
    <p id="current-temp"></p>
    <p id="current-desc"></p>
    <div id="forecast"></div>
  </section>

  <!-- Company Spotlights -->
  <section class="spotlights">
    <h2>Member Spotlights</h2>
    <div id="spotlight-container"></div>
  </section>

  <footer>
    <p>&copy; 2025 Raymond Bamutesiza</p>
  </footer>

  <script src="scripts/weather.js"></script>
  <script src="scripts/spotlight.js"></script>
</body>
</html>
