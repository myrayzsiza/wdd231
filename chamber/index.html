<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chamber of Commerce Member Directory | Home</title>
  <meta name="description" content="Welcome to the Chamber of Commerce home page — find upcoming events, local weather, member spotlights, and how to join the chamber." />
  <meta name="author" content="Raymond Bamutesiza" />

  <meta property="og:title" content="Chamber of Commerce — Home & Member Spotlights" />
  <meta property="og:description" content="Discover local businesses, upcoming chamber events, and featured member spotlights. Join the chamber to connect with community organizations and services." />
  <meta property="og:image" content="https://myrayzsiza.github.io/wdd231/chamber/images/og-image.png" />
  <meta property="og:url" content="https://myrayzsiza.github.io/wdd231/chamber/index.html" />
  <link rel="icon" href="images/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles/small.css" />
  <link rel="stylesheet" href="styles/large.css" media="screen and (min-width: 768px)" />
</head>
<body>
  <header id="siteHeader">
    <div id="logo-area">
      <a href="index.html"><img src="images/logo.svg" alt="Site Logo"></a>
      <span id="site-title">Chamber of Commerce</span>
    </div>
    <button id="hamburger" aria-expanded="false" aria-controls="navMenu">☰</button>
  </header>

  <nav id="navMenu" aria-label="Main navigation">
    <a href="index.html" class="active">Home</a>
    <a href="directory.html">Directory</a>
    <a href="join.html">Join</a>
  </nav>

  <main>
    <h1>Welcome to the Chamber</h1>

    <section class="hero" aria-label="Hero">
      <img src="images/hero.jpg" alt="Community members at an event" />
      <div class="cta">
        <a href="join.html" class="btn">Join the Chamber</a>
      </div>
    </section>

    <section class="events" aria-labelledby="events-heading">
      <h2 id="events-heading">Upcoming Events</h2>
      <ul>
        <li>Business Networking Night – Nov 20</li>
        <li>Holiday Market – Dec 5</li>
      </ul>
    </section>

    <section class="weather" aria-labelledby="weather-heading">
      <h2 id="weather-heading">Local Weather</h2>
      <p id="current-temp">Temp: —</p>
      <p id="current-desc">Description: —</p>
      <div id="forecast" aria-live="polite"></div>
    </section>

    <section class="spotlights" aria-labelledby="spotlights-heading">
      <h2 id="spotlights-heading">Member Spotlights</h2>
      <div id="spotlight-container" class="spotlight-grid" role="list"></div>
    </section>
  </main>

  <footer>
    <div id="socials">
      <a href="https://github.com/myrayzsiza" target="_blank" aria-label="GitHub">
        <img src="images/github-icon.svg" alt="GitHub Logo" />
      </a>
      <a href="https://www.linkedin.com/in/raymond-bamutesiza-127136357/" target="_blank" aria-label="LinkedIn">
        <img src="images/linkedin-icon.svg" alt="LinkedIn Logo" />
      </a>
      <a href="#" target="_blank" aria-label="Twitter">
        <img src="images/twitter-icon.svg" alt="Twitter Logo" />
      </a>
      <a href="#" target="_blank" aria-label="Facebook">
        <img src="images/facebook-icon.svg" alt="Facebook Logo" />
      </a>
    </div>

    <p>&copy; <span id="currentyear"></span> Raymond Bamutesiza | Uganda</p>
    <p>Last Modified: <span id="lastModified"></span></p>
  </footer>

  <script src="scripts/weather.js"></script>
  <script src="scripts/spotlight.js"></script>
</body>
</html>
