<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Raymond Chamber of Commerce</title>
    
    <meta name="description" content="Sign up to join the Raymond Chamber of Commerce and connect with local businesses.">
    <meta name="author" content="Raymond">
    
    <!-- Favicon -->
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">

    <!-- Open Graph -->
    <meta property="og:title" content="Join the Raymond Chamber of Commerce">
    <meta property="og:description" content="Sign up to join the Raymond Chamber of Commerce and connect with local businesses.">
    <meta property="og:image" content="images/og-image.png">
    <meta property="og:url" content="https://example.com/join.html">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/large.css">
</head>
<body>
    <header>
        <h1>Raymond Chamber of Commerce</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="directory.html">Directory</a></li>
                <li><a href="join.html" class="active">Join</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="membership-form">
            <h2>Membership Application</h2>
            <form action="thankyou.html" method="get">
                <label for="fname">First Name:
                    <input type="text" id="fname" name="fname" required autocomplete="given-name" placeholder="John" title="Enter your first name">
                </label>

                <label for="lname">Last Name:
                    <input type="text" id="lname" name="lname" required autocomplete="family-name" placeholder="Doe" title="Enter your last name">
                </label>

                <label for="email">Email:
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="name@example.com" title="Enter your email address">
                </label>

                <label for="phone">Mobile Phone:
                    <input type="tel" id="phone" name="phone" required autocomplete="tel" placeholder="+256701976441" title="Enter your mobile phone number">
                </label>

                <label for="business">Organization Name:
                    <input type="text" id="business" name="business" required autocomplete="organization" placeholder="Example Corp" title="Enter your organization name">
                </label>

                <label for="orgTitle">Organization Title:
                  <input type="text" id="orgTitle" name="orgTitle" autocomplete="organization-title"
                        placeholder="CEO, Manager" required pattern="[A-Za-z0-9\s]{2,50}"
                        title="Only letters, numbers, and spaces. 2-50 characters.">
                </label>

                <label for="membership">Membership Level:
                    <select id="membership" name="membership" required title="Select a membership level">
                        <option value="" disabled selected>Select Membership Level</option>
                        <option value="np">Non-Profit</option>
                        <option value="bronze">Bronze</option>
                        <option value="silver">Silver</option>
                        <option value="gold">Gold</option>
                    </select>
                </label>

                <label for="description">Organization Description:
                    <textarea id="description" name="description" placeholder="Brief description of your organization" title="Enter a description of your organization"></textarea>
                </label>
                <input type="hidden" id="timestamp" name="timestamp" value="">

                <button type="submit">Submit Application</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Raymond Chamber of Commerce</p>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
