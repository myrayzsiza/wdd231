<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Raymond Chamber of Commerce</title>
    
    <meta name="description" content="Sign up to join the Raymond Chamber of Commerce and connect with local businesses.">
    <meta name="author" content="Raymond">
    
    <!-- Favicon -->
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">

    <!-- Open Graph -->
    <meta property="og:title" content="Join the Raymond Chamber of Commerce">
    <meta property="og:description" content="Sign up to join the Raymond Chamber of Commerce and connect with local businesses.">
    <meta property="og:image" content="https://example.com/images/og-image.jpg">
    <meta property="og:url" content="https://example.com/join.html">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/large.css">
</head>
<body>
    <header>
        <div id="logo-area">
            <img src="images/logo.png" alt="Raymond Chamber of Commerce Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="join.html">Join</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <img src="images/chamber-hero.jpg" alt="Chamber of Commerce event">
            <div class="cta">
                <a href="#membership-form" class="btn">Join Now</a>
            </div>
        </section>

        <section id="membership-form" class="membership-form">
            <h1>Chamber of Commerce Membership Form</h1>
            <form method="get" action="thankyou.html">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" title="Enter your first name" required>

                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" title="Enter your last name" required>

                <label for="orgTitle">Organization Title</label>
                <input type="text" id="orgTitle" name="orgTitle" title="Enter your job title" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" title="Enter your email address" required>

                <label for="mobile">Mobile Phone</label>
                <input type="tel" id="mobile" name="mobile" title="Enter your mobile phone number" required>

                <label for="orgName">Organization Name</label>
                <input type="text" id="orgName" name="orgName" title="Enter your organization's name" required>

                <label for="membershipLevel">Membership Level</label>
                <select id="membershipLevel" name="membershipLevel" title="Select membership level" required>
                    <option value="">Select Level</option>
                    <option value="basic">Basic</option>
                    <option value="premium">Premium</option>
                    <option value="corporate">Corporate</option>
                </select>

                <label for="orgDesc">Organization Description</label>
                <textarea id="orgDesc" name="orgDesc" title="Describe your organization" required></textarea>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Raymond Bamutesiza Chamber of Commerce</p>
        <div id="socials">
            <a href="#"><img src="images/facebook-icon.svg" alt="Facebook"></a>
            <a href="#"><img src="images/twitter-icon.svg" alt="Twitter"></a>
            <a href="#"><img src="images/linkedin-icon.svg" alt="LinkedIn"></a>
        </div>
    </footer>

    <script src="scripts/join.js" defer></script>
</body>
</html>
